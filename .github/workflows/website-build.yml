name: Build the website
on:
  workflow_call:
    inputs:
      upload:
        description: Upload the built site for GitHub Pages
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The privacy policy's "Last updated" date is its file's last commit
          # (apps/website/src/app/(site)/privacy/page.tsx), so the history is
          # needed, though not the old versions of every file.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Just the site's dependencies, not the desktop app's (Electron and its
      # packaging tools), and none of their install scripts.
      - run: npm ci --workspace @alto/website --include-workspace-root=false --ignore-scripts
      # The build captures its pictures in Chromium. Install scripts are skipped
      # above, so install it (and its system libraries) here.
      - run: npx --workspace @alto/website playwright install --with-deps chromium
      - run: npm run build --workspace @alto/website
      - uses: actions/upload-artifact@v7
        with:
          name: media
          path: apps/website/out/media/*.png
          if-no-files-found: error
      - if: inputs.upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/website/out
