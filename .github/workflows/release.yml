name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Keeps the release PR up to date, and creates the tag and GitHub release
      # once it's merged.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml

  upload:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    steps:
      # The run's artifacts are the packages (build.yml).
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Attach the packages to the release
        run: gh release upload "${TAG}" packages/* --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
