name: Website
on:
  pull_request:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds apps/website on every PR, so a broken site never reaches main.
  # (Vercel builds a preview of it too: apps/website/vercel.json.)
  build:
    uses: ./.github/workflows/website-build.yml
