name: Build packages
on:
  workflow_call:
    inputs:
      release:
        description: Build a release, rather than a nightly (packages/node/src/build-info.ts)
        type: boolean
        default: false

jobs:
  build:
    # Alto's Electron fork is only built for linux-x64 so far. Pinned to 24.04:
    # electron-installer-redhat (the rpm maker) breaks with the newer rpmbuild
    # on 26.04 (electron-userland/electron-installer-redhat#343).
    runs-on: ubuntu-24.04
    env:
      ALTO_RELEASE: ${{ inputs.release && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot rpm squashfs-tools
      - run: npm ci
      - name: Build the .deb, .rpm and AppImage
        run: npx electron-forge make --targets deb,rpm,AppImage
      # Wraps the app Forge just packaged (out/Alto-linux-x64) as a snap
      # (snap/snapcraft.yaml). Snapcraft sets up LXD itself.
      - name: Build the snap
        run: |
          sudo snap install snapcraft --classic
          # Docker on the runner drops forwarded traffic, which cuts LXD's
          # build container off from the network.
          sudo iptables -P FORWARD ACCEPT
          sudo snapcraft pack --verbose
      # Each package is its own artifact, uploaded as is (not zipped), so it
      # downloads as the package itself. Its name is the file's.
      - uses: actions/upload-artifact@v7
        with:
          path: out/make/deb/x64/*.deb
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: out/make/rpm/x64/*.rpm
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: out/make/AppImage/x64/*.AppImage
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: '*.snap'
          archive: false
          if-no-files-found: error
